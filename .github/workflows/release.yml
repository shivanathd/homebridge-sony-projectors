# Publish to npm when a GitHub release is published, using npm trusted publishing (OIDC): no npm token is stored anywhere, and npm attaches a provenance
# attestation linking the package to this workflow run.
#
# One-time setup on npmjs.com: package settings > Trusted publishing > add GitHub Actions with this repository and the workflow file name release.yml.
# Then set the package's publishing access to "Require two-factor authentication and disallow tokens".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      # The first version of a package has to be published by hand (npm only allows trusted publishing for packages that already exist), and re-running a
      # release must not fail, so a version npm already has is skipped.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This version is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo "--tag next")

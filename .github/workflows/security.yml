# Security scanning: CodeQL static analysis, dependency vulnerabilities (npm audit, OSV-Scanner), secret scanning (gitleaks), and dependency review on pull
# requests. Runs on every push and pull request, and weekly so newly published advisories are caught without a code change.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary is used directly (verified against the release checksums) to scan the full history. gitleaks-action computes a
      # "<first-commit>^..HEAD" range on push, which fails on a repository's first push because the root commit has no parent.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -o "gitleaks_${VERSION}_linux_x64.tar.gz" "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
